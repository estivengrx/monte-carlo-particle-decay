# THIS IS JUST A TEMPLATE FOR NOW

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-particle-decay"
version = "0.1.0"
description = "A Monte Carlo simulation for particle decay analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENCE"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.dependencies]
numpy = "*"
scipy = "*"
matplotlib = "*"

[project.scripts]
run-simulation = "scripts.run_simulation:main"
run-analysis = "scripts.run_analysis:main"