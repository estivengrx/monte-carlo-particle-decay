[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-particle-decay"
version = "0.2.0"
description = "Monte Carlo study of the free-muon decay electron spectrum"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENCE" }
authors = [
    { name = "Estiven Castrillon Alzate" }
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "SciencePlots>=2.1",
    "tqdm>=4.65",
    "particle>=0.25",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[project.urls]
Repository = "https://github.com/estivengrx/monte-carlo-particle-decay"
Issues = "https://github.com/estivengrx/monte-carlo-particle-decay/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test.py", "test_*.py"]
addopts = "-ra"